name: Dev to Stable Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build installable APK
        run: ./gradlew assembleDebug

      - name: Push dev commit to stable
        env:
          STABLE_DEPLOY_KEY_B64: ${{ secrets.STABLE_DEPLOY_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$STABLE_DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/stable_deploy_key
          chmod 600 ~/.ssh/stable_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          GIT_SSH_COMMAND="ssh -i ~/.ssh/stable_deploy_key -o IdentitiesOnly=yes" \
            git push git@github.com:${{ github.repository }}.git HEAD:stable

      - name: Prepare release info
        id: release
        run: |
          COMMIT_NAME="$(git log -1 --pretty=%s)"
          TAG="release-$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          echo "commit_name=$COMMIT_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.commit_name }}
          target_commitish: stable
          files: app/build/outputs/apk/debug/*.apk
