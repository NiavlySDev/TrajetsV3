name: Dev to Stable Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Push dev commit to stable
        run: |
          git push origin HEAD:stable

      - name: Prepare release info
        id: release
        run: |
          COMMIT_NAME="$(git log -1 --pretty=%s)"
          TAG="release-$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}"
          echo "commit_name=$COMMIT_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.commit_name }}
          target_commitish: stable
          files: app/build/outputs/apk/release/*.apk
